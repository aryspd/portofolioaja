<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Arya Sukma</title>
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
    <style>
        /* =========================================================
           1. RESET & VARIABLE (Galaxy Brutalist)
           ========================================================= */
        :root {
            --bg-color: #050508;
            --card-bg: #0a0a12;
            --accent-1: #00f3ff; /* Neon Cyan */
            --accent-2: #bc00ff; /* Neon Purple */
            --text-main: #ffffff;
            --text-dim: #a0a0b0;
            --border-width: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* =========================================================
           2. ANIMATED GALAXY BACKGROUND
           ========================================================= */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 2px);
            background-size: 400px 400px, 250px 250px;
            background-position: 0 0, 100px 150px;
            animation: stars-move 100s linear infinite;
            z-index: -1;
            opacity: 0.5;
        }

        @keyframes stars-move {
            from { transform: translateY(0); }
            to { transform: translateY(-1000px); }
        }

        /* =========================================================
           3. BRUTALIST CONTACT CARD
           ========================================================= */
        .contact-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .contact-card {
            background: var(--card-bg);
            border: var(--border-width) solid var(--text-main);
            padding: 3rem 2rem;
            box-shadow: 15px 15px 0px var(--accent-2);
            transition: all 0.3s ease;
        }

        .contact-card:hover {
            transform: translate(-5px, -5px);
            box-shadow: 25px 25px 0px var(--accent-1);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            line-height: 0.9;
            text-align: left;
            border-bottom: var(--border-width) solid var(--text-main);
            display: inline-block;
            margin-bottom: 2rem;
        }

        .contact-description {
            color: var(--text-dim);
            margin-bottom: 2.5rem;
            font-size: 1rem;
            text-align: left;
        }

        /* =========================================================
           4. NEON BUTTONS
           ========================================================= */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            border: var(--border-width) solid var(--text-main);
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.1rem;
            transition: 0.2s;
            background: transparent;
        }

        .contact-btn i {
            font-size: 1.8rem;
        }

        /* WhatsApp Style */
        .btn-wa:hover {
            background-color: #25d366;
            color: #000;
            box-shadow: 8px 8px 0px var(--text-main);
            transform: scale(1.02);
        }

        /* Email Style */
        .btn-mail:hover {
            background-color: var(--accent-1);
            color: #000;
            box-shadow: 8px 8px 0px var(--text-main);
            transform: scale(1.02);
        }

        /* =========================================================
           5. DECORATION ELEMENTS
           ========================================================= */
        .ufo-decor {
            position: absolute;
            font-size: 4rem;
            top: -60px;
            right: -30px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(10deg); }
            50% { transform: translateY(-20px) rotate(-10deg); }
        }

        .back-home {
            margin-top: 3rem;
            display: inline-block;
            color: var(--accent-1);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
        }

        .back-home:hover {
            border-bottom-color: var(--accent-1);
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .contact-card { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <div class="ufo-decor">🛸</div>
        
        <div class="contact-card">
            <h1>CONTACT<br>ME_</h1>
            
            <p class="contact-description">
                Punya pertanyaan atau ingin berkolaborasi? <br>
                Silakan hubungi saya melalui platform di bawah ini.
            </p>

            <div class="btn-list">
                <a href="https://wa.me/6289629986883" target="_blank" class="contact-btn btn-wa">
                    <span>WhatsApp</span>
                    <i class='bx bxl-whatsapp'></i>
                </a>

                <a href="mailto:arya.sukma.420@gmail.com" class="contact-btn btn-mail">
                    <span>Email Me</span>
                    <i class='bx bx-envelope'></i>
                </a>
            </div>
        </div>

        <a href="index.html" class="back-home">← Back to Portfolio</a>
    </div>

</body>
</html>
